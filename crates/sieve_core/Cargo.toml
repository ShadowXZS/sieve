[package]
name = "sieve_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
csv-core = { version = "0.1.13", default-features = false }
hashbrown = "0.16.1"
memchr = { version = "2", default-features = false }
wasm-bindgen = "0.2.130"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
wasm-bindgen-test = "0.3.80"
